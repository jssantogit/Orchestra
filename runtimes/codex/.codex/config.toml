#:schema https://developers.openai.com/codex/config-schema.json
# Orchestra: project-local Codex defaults.
# Scoped to the repository; user-global configuration remains untouched.
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
model_instructions_file = "astra-orchestra/INSTRUCTIONS.md"

[features]
multi_agent = true
multi_agent_v2 = true

[agents]
enabled = true
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-luna"
# Luna Max is the default execution-plane profile; the router explicitly
# selects High for small/simple work.
default_subagent_reasoning_effort = "max"

# If the repository contains an `.agents/skills` tree owned by Antigravity,
# disable Antigravity-specific skills by name in this project layer.
[[skills.config]]
name = "orchestra"
enabled = false

[[skills.config]]
name = "critical-review"
enabled = false

[[skills.config]]
name = "evidence-validation"
enabled = false

[[skills.config]]
name = "implementation-contract"
enabled = false

[[skills.config]]
name = "integration"
enabled = false

[[skills.config]]
name = "progressive-testing"
enabled = false
