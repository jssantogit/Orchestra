name: Diagnose Release Readiness

on:
  pull_request:
    branches: [ main ]

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Targeted release-readiness contract
        run: node --test tests/release/release-readiness.test.mjs
