name: Diagnose Installers

on:
  pull_request:
    branches: [ main ]

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Codex clean install
        run: node --test --test-name-pattern="installer: installs Codex runtime cleanly" tests/installers/installers.test.mjs
      - name: Antigravity clean install
        run: node --test --test-name-pattern="installer: installs Antigravity runtime cleanly" tests/installers/installers.test.mjs
      - name: Codex second install conflict
        run: node --test --test-name-pattern="installer: aborts on conflict without destructive overwrite \(Codex\)" tests/installers/installers.test.mjs
      - name: Antigravity second install conflict
        run: node --test --test-name-pattern="installer: aborts on conflict without destructive overwrite \(Antigravity\)" tests/installers/installers.test.mjs
