name: Publish Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: orchestra-publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish operator-authorized release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the exact verified main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('package.json','utf8')).version)")
          TAG="v${VERSION}"
          NOTES="docs/release/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "No generated release notes for ${TAG}; this CI success is not a prepared release." >> "$GITHUB_STEP_SUMMARY"
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_SHA=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)
          TAG_EXISTS=false
          if [ -n "$TAG_SHA" ]; then
            TAG_EXISTS=true
          fi

          RELEASE_EXISTS=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "notes=${NOTES}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=${TAG_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "release_exists=${RELEASE_EXISTS}" >> "$GITHUB_OUTPUT"

          if [ "$TAG_EXISTS" = true ] && [ "$RELEASE_EXISTS" = true ]; then
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} is already published; later main commits are not new releases." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$TAG_EXISTS" = false ] && [ "$RELEASE_EXISTS" = true ]; then
            echo "GitHub Release ${TAG} exists without its tag." >&2
            exit 5
          fi
          if [ "$TAG_EXISTS" = true ] && [ "$TAG_SHA" != "$SHA" ]; then
            echo "Existing unpublished tag ${TAG} points to ${TAG_SHA}, not authorized SHA ${SHA}." >&2
            exit 6
          fi
          echo "publish_needed=true" >> "$GITHUB_OUTPUT"

      - name: Fetch pull requests associated with the exact SHA
        if: steps.state.outputs.publish_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            > "$RUNNER_TEMP/associated-prs.json"

      - name: Verify operator authorization
        if: steps.state.outputs.publish_needed == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          node scripts/release/publish-guard.mjs \
            --version="${{ steps.state.outputs.version }}" \
            --sha="$SHA" \
            --ci-conclusion="$CI_CONCLUSION" \
            --prs-file="$RUNNER_TEMP/associated-prs.json"

      - name: Create annotated release tag
        if: steps.state.outputs.publish_needed == 'true' && steps.state.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.state.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Orchestra ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Build publication notes with exact CI evidence
        if: steps.state.outputs.publish_needed == 'true' && steps.state.outputs.release_exists != 'true'
        env:
          TAG: ${{ steps.state.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          NOTES: ${{ steps.state.outputs.notes }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          cp "$NOTES" "$RUNNER_TEMP/release-notes.md"
          {
            echo
            echo "## Publication evidence"
            echo
            echo "- Exact main SHA: \`${SHA}\`"
            echo "- Canonical CI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
            echo "- CI conclusion: \`success\`"
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        if: steps.state.outputs.publish_needed == 'true' && steps.state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Orchestra ${TAG}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
