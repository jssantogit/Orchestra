name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Orchestra 1.x RC Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Verify canonical generated artifacts
        run: |
          npm run check:schemas
          npm run check:runtime-core
          git diff --check

      - name: Verify manifest-driven runtime distributions
        run: |
          node --test tests/runtime/runtime-manifest.test.mjs tests/runtime/runtime-builder.test.mjs
          npm run build:runtimes
          npm run check:runtimes

      - name: Verify Core, Direct Work, and Work Lease authority
        run: |
          npm run test:core
          npm run test:direct-work
          npm run test:leases

      - name: Verify provider policy and parity surfaces
        run: |
          node --test tests/provider-contract/*.test.mjs
          npm run test:codex
          npm run test:antigravity
          npm run test:hooks

      - name: Verify Dream compatibility Lab
        run: npm run test:dream

      - name: Verify Jev compatibility Lab
        run: npm run test:jev

      - name: Verify canonical zero-authority Lab contracts
        run: npm run test:labs

      - name: Verify manifest project manager and self-contained installs
        run: |
          node --test tests/installers/manifest-project-runtime-manager.test.mjs tests/leases/project-state-ignore.test.mjs
          npm run test:installers

      - name: Run manifest-driven Doctor
        run: npm run doctor

      - name: Verify architecture firewall and contamination
        run: |
          npm run test:architecture-invariants
          npm run test:firewall
          npm run check:contamination

      - name: Verify RC release readiness
        run: |
          node --test tests/release/release-readiness.test.mjs
          npm run release:readiness

      - name: Run full regression
        run: npm test
