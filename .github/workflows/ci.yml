name: CI

on:
  push:
    branches: [ main, design/cross-provider-delegation ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Orchestra 1.x RC Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Build and verify generated artifacts
        run: |
          npm run build:schemas
          npm run build:runtimes
          npm run check:schemas
          npm run check:runtimes
          npm run check:runtime-core
          git diff --check

      # Diagnostic decomposition of `npm test`: each command below is one of the
      # existing regression components, kept separate so Actions exposes the first
      # failing boundary even when raw job logs are unavailable.
      - name: Regression — runtime
        run: npm run test:runtime

      - name: Regression — core
        run: npm run test:core

      - name: Regression — delegation
        run: npm run test:delegation

      - name: Regression — direct work
        run: npm run test:direct-work

      - name: Regression — leases
        run: npm run test:leases

      - name: Regression — Codex
        run: npm run test:codex

      - name: Regression — Antigravity routing
        run: node --test runtimes/antigravity/tests/routing-policy.test.mjs

      - name: Regression — Antigravity hooks
        run: node --test --test-concurrency=1 runtimes/antigravity/tests/hooks.test.mjs

      - name: Regression — dream
        run: npm run test:dream

      - name: Regression — evidence
        run: npm run test:evidence

      - name: Regression — feedback
        run: npm run test:feedback

      - name: Regression — trust
        run: npm run test:trust

      - name: Regression — handoff
        run: npm run test:handoff

      - name: Regression — JEV
        run: npm run test:jev

      - name: Regression — labs
        run: npm run test:labs

      - name: Regression — mechanical
        run: npm run test:mechanical

      - name: Regression — firewall
        run: npm run test:firewall

      - name: Regression — installers
        run: npm run test:installers

      - name: Regression — turn-economy instrumentation
        run: node --test tests/turn-economy/instrumentation.test.mjs

      - name: Regression — token semantics
        run: node --test tests/turn-economy/token-semantics.test.mjs

      - name: Regression — turn-economy fidelity
        run: node --test tests/turn-economy/fidelity.test.mjs

      - name: Regression — turn diet
        run: node --test tests/turn-economy/turn-diet.test.mjs

      - name: Regression — critical-review consensus
        run: node --test tests/turn-economy/critical-review-consensus.test.mjs

      - name: Regression — architecture invariants
        run: npm run test:architecture-invariants

      - name: Verify isolated runtimes, Doctor, contamination, and firewall
        run: |
          node --test tests/installers/self-contained-runtime.test.mjs
          npm run doctor
          npm run check:contamination
          npm run test:firewall

      - name: Verify release readiness
        run: |
          node --test tests/release/release-readiness.test.mjs
          npm run release:readiness

      - name: Verify representative turn-economy scenarios
        run: |
          node --test tests/direct-work/turn-economy-probes.test.mjs
          npm run test:turn-economy

  portable-runtime:
    name: Portable Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Verify provider project lifecycles and runtime portability
        run: node --test tests/installers/codex-v2-doctor.test.mjs tests/installers/antigravity-v2-doctor.test.mjs tests/runtime/runtime-builder.test.mjs tests/runtime/doctor.test.mjs

      - name: Build runtime distributions
        run: npm run build:runtimes

      - name: Run Orchestra Doctor
        run: npm run doctor
