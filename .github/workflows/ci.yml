name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Deterministic Policy & Firewall Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Run Provider Contract Tests
        run: node --test tests/provider-contract/*.test.mjs

      - name: Run Neutral Authorization Contract Tests
        run: node --test tests/core/capability-authorization.test.mjs tests/core/mutation-authorization.test.mjs

      - name: Verify canonical schema and runtime-core artifacts
        run: |
          npm run check:schemas
          npm run check:runtime-core
          git diff --check

      - name: Run Core Foundation Tests
        run: npm run test:core

      - name: Run Direct Work Tests
        run: npm run test:direct-work

      - name: Run Work Lease Authority Tests
        run: npm run test:leases

      - name: Run Antigravity Policy Tests
        run: node --test runtimes/antigravity/tests/routing-policy.test.mjs

      - name: Diagnose Contamination
        continue-on-error: true
        run: node scripts/contamination-check.mjs

      - name: Diagnose Codex Policy
        continue-on-error: true
        run: node --test runtimes/codex/tests/routing-policy.test.mjs

      - name: Diagnose Codex Parity Session
        continue-on-error: true
        run: node --test runtimes/codex/tests/parity.test.mjs runtimes/codex/tests/evidence-observability.test.mjs runtimes/codex/tests/session-authority.test.mjs runtimes/codex/tests/session-hook.test.mjs

      - name: Diagnose Codex Installer
        continue-on-error: true
        run: node --test tests/installers/codex-project-runtime-manager.test.mjs

      - name: Diagnose Evidence
        continue-on-error: true
        run: npm run test:evidence

      - name: Diagnose Mechanical
        continue-on-error: true
        run: npm run test:mechanical

      - name: Diagnose Milestones IJK
        continue-on-error: true
        run: node --test tests/feedback/feedback-plane.test.mjs tests/trust/trust-boundary.test.mjs tests/exploration/full-exploration.test.mjs

      - name: Diagnose Handoff
        continue-on-error: true
        run: npm run test:handoff

      - name: Diagnose Jev
        continue-on-error: true
        run: npm run test:jev

      - name: Diagnose Firewall
        continue-on-error: true
        run: node --test tests/cross-runtime/cross-runtime-firewall.test.mjs

      - name: Run Doctor & Health Checks
        run: ./scripts/doctor.sh

      - name: Run Codex Policy Tests
        run: node --test runtimes/codex/tests/routing-policy.test.mjs

      - name: Run Codex Parity Tests
        run: npm run test:codex-parity

      - name: Run Antigravity Hook Tests
        run: node --test --test-concurrency=1 runtimes/antigravity/tests/hooks.test.mjs

      - name: Run Dream Layer Tests
        run: npm run test:dream

      - name: Run Evidence Contract Tests
        run: npm run test:evidence

      - name: Run Attributable Feedback Tests
        run: npm run test:feedback

      - name: Run Context Trust Boundary Tests
        run: npm run test:trust

      - name: Run Orchestrator Session Handoff Tests
        run: npm run test:handoff

      - name: Run Jev Semantic Shadow Tests
        run: npm run test:jev

      - name: Run Mechanical Fast Path Tests
        run: npm run test:mechanical

      - name: Run Turn Economy Tests
        run: npm run test:turn-economy

      - name: ARCH canary H01
        if: always()
        run: node --test --test-name-pattern='^ARCH-H01:' tests/architecture-invariants/canary-authority.test.mjs
      - name: ARCH canary H02
        if: always()
        run: node --test --test-name-pattern='^ARCH-H02:' tests/architecture-invariants/canary-authority.test.mjs
      - name: ARCH canary H03
        if: always()
        run: node --test --test-name-pattern='^ARCH-H03:' tests/architecture-invariants/canary-authority.test.mjs
      - name: ARCH canary H04
        if: always()
        run: node --test --test-name-pattern='^ARCH-H04:' tests/architecture-invariants/canary-authority.test.mjs
      - name: ARCH canary H05
        if: always()
        run: node --test --test-name-pattern='^ARCH-H05:' tests/architecture-invariants/canary-authority.test.mjs
      - name: ARCH canary H06
        if: always()
        run: node --test --test-name-pattern='^ARCH-H06:' tests/architecture-invariants/canary-authority.test.mjs
      - name: ARCH canary H07
        if: always()
        run: node --test --test-name-pattern='^ARCH-H07:' tests/architecture-invariants/canary-authority.test.mjs

      - name: ARCH evidence 01
        if: always()
        run: node --test --test-name-pattern='^ARCH-EVIDENCE-01:' tests/architecture-invariants/evidence-authority.test.mjs
      - name: ARCH evidence 02
        if: always()
        run: node --test --test-name-pattern='^ARCH-EVIDENCE-02:' tests/architecture-invariants/evidence-authority.test.mjs
      - name: ARCH evidence 03
        if: always()
        run: node --test --test-name-pattern='^ARCH-EVIDENCE-03:' tests/architecture-invariants/evidence-authority.test.mjs
      - name: ARCH evidence 04
        if: always()
        run: node --test --test-name-pattern='^ARCH-EVIDENCE-04:' tests/architecture-invariants/evidence-authority.test.mjs
      - name: ARCH evidence 05
        if: always()
        run: node --test --test-name-pattern='^ARCH-EVIDENCE-05:' tests/architecture-invariants/evidence-authority.test.mjs
      - name: ARCH evidence 06
        if: always()
        run: node --test --test-name-pattern='^ARCH-EVIDENCE-06:' tests/architecture-invariants/evidence-authority.test.mjs
      - name: ARCH evidence 06B
        if: always()
        run: node --test --test-name-pattern='^ARCH-EVIDENCE-06B:' tests/architecture-invariants/evidence-authority.test.mjs
      - name: ARCH evidence 07
        if: always()
        run: node --test --test-name-pattern='^ARCH-EVIDENCE-07:' tests/architecture-invariants/evidence-authority.test.mjs
      - name: ARCH evidence federation adapter
        if: always()
        run: node --test --test-name-pattern='^evidence federation provider modules' tests/architecture-invariants/evidence-authority.test.mjs
      - name: ARCH evidence 08
        if: always()
        run: node --test --test-name-pattern='^ARCH-EVIDENCE-08:' tests/architecture-invariants/evidence-authority.test.mjs
      - name: ARCH evidence 09
        if: always()
        run: node --test --test-name-pattern='^ARCH-EVIDENCE-09:' tests/architecture-invariants/evidence-authority.test.mjs
      - name: ARCH evidence 10
        if: always()
        run: node --test --test-name-pattern='^ARCH-EVIDENCE-10:' tests/architecture-invariants/evidence-authority.test.mjs
      - name: ARCH evidence 11
        if: always()
        run: node --test --test-name-pattern='^ARCH-EVIDENCE-11:' tests/architecture-invariants/evidence-authority.test.mjs

      - name: ARCH mechanical 01
        if: always()
        run: node --test --test-name-pattern='^ARCH-MECHANICAL-01:' tests/architecture-invariants/mechanical-fast-path-authority.test.mjs
      - name: ARCH mechanical 02
        if: always()
        run: node --test --test-name-pattern='^ARCH-MECHANICAL-02:' tests/architecture-invariants/mechanical-fast-path-authority.test.mjs
      - name: ARCH mechanical 03
        if: always()
        run: node --test --test-name-pattern='^ARCH-MECHANICAL-03:' tests/architecture-invariants/mechanical-fast-path-authority.test.mjs
      - name: ARCH mechanical 04
        if: always()
        run: node --test --test-name-pattern='^ARCH-MECHANICAL-04:' tests/architecture-invariants/mechanical-fast-path-authority.test.mjs
      - name: ARCH mechanical 05
        if: always()
        run: node --test --test-name-pattern='^ARCH-MECHANICAL-05:' tests/architecture-invariants/mechanical-fast-path-authority.test.mjs
      - name: ARCH mechanical 06
        if: always()
        run: node --test --test-name-pattern='^ARCH-MECHANICAL-06:' tests/architecture-invariants/mechanical-fast-path-authority.test.mjs

      - name: ARCH provider 01
        if: always()
        run: node --test --test-name-pattern='^ARCH-PROVIDER-01:' tests/architecture-invariants/evidence-provider-watch-authority.test.mjs
      - name: ARCH provider 02
        if: always()
        run: node --test --test-name-pattern='^ARCH-PROVIDER-02:' tests/architecture-invariants/evidence-provider-watch-authority.test.mjs
      - name: ARCH provider 03
        if: always()
        run: node --test --test-name-pattern='^ARCH-PROVIDER-03:' tests/architecture-invariants/evidence-provider-watch-authority.test.mjs
      - name: ARCH provider 04
        if: always()
        run: node --test --test-name-pattern='^ARCH-PROVIDER-04:' tests/architecture-invariants/evidence-provider-watch-authority.test.mjs
      - name: ARCH provider 05
        if: always()
        run: node --test --test-name-pattern='^ARCH-PROVIDER-05:' tests/architecture-invariants/evidence-provider-watch-authority.test.mjs
      - name: ARCH provider adapter
        if: always()
        run: node --test --test-name-pattern='^evidence watch provider modules' tests/architecture-invariants/evidence-provider-watch-authority.test.mjs
      - name: ARCH provider 06
        if: always()
        run: node --test --test-name-pattern='^ARCH-PROVIDER-06:' tests/architecture-invariants/evidence-provider-watch-authority.test.mjs
      - name: ARCH provider 07
        if: always()
        run: node --test --test-name-pattern='^ARCH-PROVIDER-07:' tests/architecture-invariants/evidence-provider-watch-authority.test.mjs

      - name: Run unaffected Architecture Invariants
        if: always()
        run: node --test tests/architecture-invariants/dream-authority.test.mjs tests/architecture-invariants/policy-lab-authority.test.mjs tests/architecture-invariants/shadow-authority.test.mjs tests/architecture-invariants/project-runtime-authority.test.mjs tests/architecture-invariants/milestones-i-j-k-authority.test.mjs tests/architecture-invariants/jev-authority.test.mjs tests/architecture-invariants/codex-parity-authority.test.mjs tests/architecture-invariants/orchestrator-handoff-authority.test.mjs tests/architecture-invariants/codex-session-authority.test.mjs tests/architecture-invariants/work-lease-authority.test.mjs

      - name: Run Cross-Runtime Firewall Tests
        run: npm run test:firewall

      - name: Run Project Runtime & Installer Tests
        run: npm run test:installers

      - name: Run Cross-Runtime Contamination Check
        run: node scripts/contamination-check.mjs

      - name: Run Full Regression
        run: npm test
