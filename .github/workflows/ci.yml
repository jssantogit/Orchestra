name: CI

on:
  push:
    branches: [ main, design/cross-provider-delegation ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  verify:
    name: Orchestra 1.x RC Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Build and verify generated artifacts
        run: |
          npm run build:schemas
          npm run sync:runtime-core
          npm run build:runtimes
          npm run check:schemas
          npm run check:runtimes
          npm run check:runtime-core
          git diff --check

      - name: Materialize runtime-core mirrors
        if: github.event_name == 'push' && github.ref == 'refs/heads/design/cross-provider-delegation'
        shell: bash
        run: |
          git add runtimes/codex/.codex/astra-orchestra/core runtimes/antigravity/.agents/skills/orchestra/core
          if git diff --cached --quiet; then
            echo "No runtime-core drift to materialize."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync delegation policy mirrors [skip ci]"
          git push origin HEAD:design/cross-provider-delegation

      - name: Run full regression
        run: npm test

      - name: Verify isolated runtimes, Doctor, contamination, and firewall
        run: |
          node --test tests/installers/self-contained-runtime.test.mjs
          npm run doctor
          npm run check:contamination
          npm run test:firewall

      - name: Verify release readiness
        run: |
          node --test tests/release/release-readiness.test.mjs
          npm run release:readiness

      - name: Verify representative turn-economy scenarios
        run: |
          node --test tests/direct-work/turn-economy-probes.test.mjs
          npm run test:turn-economy

  portable-runtime:
    name: Portable Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Verify provider project lifecycles and runtime portability
        run: node --test tests/installers/codex-v2-doctor.test.mjs tests/installers/antigravity-v2-doctor.test.mjs tests/runtime/runtime-builder.test.mjs tests/runtime/doctor.test.mjs

      - name: Build runtime distributions
        run: npm run build:runtimes

      - name: Run Orchestra Doctor
        run: npm run doctor
