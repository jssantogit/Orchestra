name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic-version bump to prepare"
        required: true
        type: choice
        options:
          - select
          - patch
          - minor
          - major
      topology:
        description: "Release topology being authorized"
        required: true
        type: choice
        options:
          - select
          - v1-compat
          - v2-cutover
      cutover_head_sha:
        description: "Exact reviewed V2-11 head (required for v2-cutover)"
        required: false
        type: string
      cutover_runtime_image_id:
        description: "Exact reviewed Runtime Image ID (required for v2-cutover)"
        required: false
        type: string
      cutover_evidence_json:
        description: "Sanitized orchestra.cutover-release-evidence.v2 JSON (required for v2-cutover)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: orchestra-prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release pull request
    runs-on: ubuntu-latest

    steps:
      - name: Require explicit release choices
        env:
          BUMP: ${{ inputs.bump }}
          TOPOLOGY: ${{ inputs.topology }}
        run: |
          if [ "$BUMP" = "select" ]; then
            echo "Choose patch, minor, or major before preparing a release." >&2
            exit 2
          fi
          if [ "$TOPOLOGY" = "select" ]; then
            echo "Choose v1-compat or v2-cutover before preparing a release." >&2
            exit 2
          fi

      - name: Check out main with release history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Materialize v2 cutover evidence
        if: inputs.topology == 'v2-cutover'
        env:
          CUTOVER_HEAD_SHA: ${{ inputs.cutover_head_sha }}
          CUTOVER_RUNTIME_IMAGE_ID: ${{ inputs.cutover_runtime_image_id }}
          CUTOVER_EVIDENCE_JSON: ${{ inputs.cutover_evidence_json }}
        run: |
          if [ -z "$CUTOVER_HEAD_SHA" ] || [ -z "$CUTOVER_RUNTIME_IMAGE_ID" ] || [ -z "$CUTOVER_EVIDENCE_JSON" ]; then
            echo "v2-cutover requires exact head, Runtime Image ID, and sanitized cutover evidence JSON." >&2
            exit 2
          fi
          if ! printf '%s' "$CUTOVER_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "cutover_head_sha must be a 40-character lowercase Git SHA." >&2
            exit 2
          fi
          EVIDENCE_PATH="$RUNNER_TEMP/v2-cutover-evidence.json"
          printf '%s' "$CUTOVER_EVIDENCE_JSON" > "$EVIDENCE_PATH"
          node -e "const fs=require('node:fs'); JSON.parse(fs.readFileSync(process.argv[1],'utf8'));" "$EVIDENCE_PATH"
          echo "ORCHESTRA_V2_REQUIRE_CUTOVER=1" >> "$GITHUB_ENV"
          echo "ORCHESTRA_V2_CUTOVER_EVIDENCE=$EVIDENCE_PATH" >> "$GITHUB_ENV"
          echo "ORCHESTRA_V2_EXPECTED_HEAD=$CUTOVER_HEAD_SHA" >> "$GITHUB_ENV"
          echo "ORCHESTRA_V2_EXPECTED_RUNTIME_IMAGE=$CUTOVER_RUNTIME_IMAGE_ID" >> "$GITHUB_ENV"

      - name: Build current main runtimes for readiness
        run: npm run build:runtimes

      - name: Verify current main release metadata
        run: npm run release:readiness

      - name: Prepare release metadata and notes
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/release/prepare-release.mjs --bump="$BUMP"

      - name: Create local release candidate
        id: candidate
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          BRANCH="release/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add --all
          git commit -m "chore(release): prepare ${TAG}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run full prepared-release preflight
        run: |
          npm run build:runtimes
          npm run check:runtimes
          npm run check:runtime-core
          npm test
          npm run doctor
          npm run check:contamination
          npm run release:readiness
          git diff --check

      - name: Require clean validated candidate
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          if ! git diff --quiet HEAD -- . || ! git diff --cached --quiet; then
            echo "Prepared-release preflight mutated tracked candidate content; refusing to publish it." >&2
            git status --short >&2
            exit 6
          fi
          rm -rf dist
          if [ -n "$(git status --porcelain)" ]; then
            echo "Prepared-release preflight left unexpected files after removing disposable dist output; refusing to push." >&2
            git status --short >&2
            exit 6
          fi
          if [ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]; then
            echo "Prepared-release candidate HEAD changed during preflight; refusing to push." >&2
            exit 6
          fi

      - name: Refuse duplicate release refs
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          BRANCH="release/${TAG}"
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists." >&2
            exit 3
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists." >&2
            exit 4
          fi

      - name: Push validated release branch
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          BRANCH="release/${TAG}"
          git push origin "HEAD:${BRANCH}"

      - name: Open operator release PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          BASE_TAG: ${{ steps.prepare.outputs.base_tag }}
          REQUESTED_BUMP: ${{ steps.prepare.outputs.requested_bump }}
          SUGGESTED_BUMP: ${{ steps.prepare.outputs.suggested_bump }}
          TOPOLOGY: ${{ inputs.topology }}
          CUTOVER_HEAD_SHA: ${{ inputs.cutover_head_sha }}
          CUTOVER_RUNTIME_IMAGE_ID: ${{ inputs.cutover_runtime_image_id }}
        run: |
          BRANCH="release/${TAG}"
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF_PR
          ## Orchestra Release Train

          - Base: \`${BASE_TAG}\`
          - Target: \`${TAG}\`
          - Requested bump: \`${REQUESTED_BUMP}\`
          - Suggested bump from conventional commits: \`${SUGGESTED_BUMP}\`
          - Topology: \`${TOPOLOGY}\`
          - Prepared-release preflight: full regression, Doctor, contamination, runtime checks, and release-readiness passed before this branch was pushed.
          EOF_PR
          if [ "$TOPOLOGY" = "v2-cutover" ]; then
            {
              echo "- V2 cutover evidence head: \`${CUTOVER_HEAD_SHA}\`"
              echo "- V2 Runtime Image: \`${CUTOVER_RUNTIME_IMAGE_ID}\`"
              echo "- V2 cutover evidence: validated by release-readiness; the sanitized JSON itself is not committed by this workflow."
            } >> "$RUNNER_TEMP/release-pr.md"
          fi
          cat >> "$RUNNER_TEMP/release-pr.md" <<EOF_PR

          Review the generated release notes and the complete diff. **Merging this PR is the operator authorization to publish ${TAG}.**

          A green CI run or a valid V2 cutover evidence record is necessary evidence, but neither one is publication authorization by itself.

          After this PR is merged into \`main\`, publication remains blocked until the canonical **CI** workflow succeeds on the exact resulting \`main\` SHA. The publisher then creates the annotated tag and GitHub Release automatically.

          Use GitHub's **Create a merge commit** option for release PRs. Squash or rebase merges fail closed because the publisher requires the exact authorized \`main\` SHA to be a two-parent merge commit attributable to this PR.
          EOF_PR
          if ! gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): Orchestra ${TAG}" \
            --body-file "$RUNNER_TEMP/release-pr.md"; then
            echo "Could not create the release PR. Ensure Settings > Actions > General allows GitHub Actions to create pull requests." >&2
            git push origin --delete "$BRANCH" || true
            exit 5
          fi

      - name: Write release summary
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
          BASE_TAG: ${{ steps.prepare.outputs.base_tag }}
          REQUESTED_BUMP: ${{ steps.prepare.outputs.requested_bump }}
          SUGGESTED_BUMP: ${{ steps.prepare.outputs.suggested_bump }}
          TOPOLOGY: ${{ inputs.topology }}
          CUTOVER_HEAD_SHA: ${{ inputs.cutover_head_sha }}
          CUTOVER_RUNTIME_IMAGE_ID: ${{ inputs.cutover_runtime_image_id }}
        run: |
          {
            echo "## Release PR prepared"
            echo
            echo "- Base: \`${BASE_TAG}\`"
            echo "- Target: \`${TAG}\`"
            echo "- Requested bump: \`${REQUESTED_BUMP}\`"
            echo "- Suggested bump: \`${SUGGESTED_BUMP}\`"
            echo "- Topology: \`${TOPOLOGY}\`"
            echo "- Prepared-release preflight: \`green\`"
            echo "- Required merge method: \`Create a merge commit\`"
            if [ "$TOPOLOGY" = "v2-cutover" ]; then
              echo "- V2 cutover evidence head: \`${CUTOVER_HEAD_SHA}\`"
              echo "- V2 Runtime Image: \`${CUTOVER_RUNTIME_IMAGE_ID}\`"
            fi
            if [ "$REQUESTED_BUMP" != "$SUGGESTED_BUMP" ] && [ "$SUGGESTED_BUMP" != "none" ]; then
              echo "- ⚠️ Requested bump differs from the conventional-commit suggestion; review before merging."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
