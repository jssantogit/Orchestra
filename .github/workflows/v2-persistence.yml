name: V2 Persistence

on:
  pull_request:
    branches:
      - main
      - feat/v2-*

jobs:
  posix-readiness:
    name: POSIX Readiness (exact PR head)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Check out exact PR head without credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect canonical POSIX readiness fragment
        id: collect-posix
        run: >-
          node scripts/collect-posix-readiness.mjs
          --repo-root "$GITHUB_WORKSPACE"
          --expected-head "${{ github.event.pull_request.head.sha }}"
          --output-dir "$RUNNER_TEMP/orchestra-posix-readiness"

      - name: Upload sanitized POSIX readiness evidence
        id: upload-posix-evidence
        uses: actions/upload-artifact@v4
        with:
          name: posix-readiness-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orchestra-posix-readiness/evidence.json
          if-no-files-found: error

      - name: Download, verify, and canonical-merge POSIX artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          VALIDATED_OUTPUT_DIR: ${{ runner.temp }}/orchestra-posix-readiness-validated
          UPLOAD_ARTIFACT_ID: ${{ steps.upload-posix-evidence.outputs.artifact-id }}
          UPLOAD_ARTIFACT_NAME: posix-readiness-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          UPLOAD_ARTIFACT_DIGEST: ${{ steps.upload-posix-evidence.outputs.artifact-digest }}
        run: node scripts/verify-posix-readiness-artifact.mjs

      - name: Record POSIX artifact provenance link
        env:
          ARTIFACT_URL: ${{ steps.upload-posix-evidence.outputs.artifact-url }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$ARTIFACT_URL"
          {
            echo "### POSIX readiness artifact"
            echo "- Exact PR head: \`$EXPECTED_HEAD\`"
            echo "- Workflow run: $RUN_URL"
            echo "- Artifact: $ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  persistence:
    name: V2 Persistence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Run v2 persistence tests
        run: node --test tests/v2-persistence/*.test.mjs

      - name: Run V2-11 cutover tests
        run: node --test tests/runtime/v2-cutover*.test.mjs

      - name: Run migration tests
        run: node --test tests/runtime/v2-migration.test.mjs tests/runtime/v2-migration-import.test.mjs tests/runtime/v2-tsuzuki-f7-migration.test.mjs

      - name: Run global Experience store tests
        run: node --test tests/runtime/v2-global-experience-store.test.mjs

      - name: Run cross-project RSI tests
        run: node --test tests/runtime/v2-cross-project-rsi.test.mjs tests/runtime/v2-rsi-replay.test.mjs tests/runtime/v2-rsi-execution-policy.test.mjs tests/runtime/v2-rsi-adversarial.test.mjs tests/runtime/v2-rsi-native-learning.test.mjs tests/runtime/v2-rsi-native-journal.test.mjs tests/runtime/v2-rsi-native-pipeline.test.mjs

      - name: Run runtime image lifecycle tests
        run: node --test tests/runtime/v2-runtime-images.test.mjs tests/runtime/v2-runtime-upgrade.test.mjs tests/runtime/v2-runtime-image-source-from-git.test.mjs

      - name: Run Codex global adapter and provider-event tests
        run: node --test tests/runtime/v2-codex-global-adapter.test.mjs tests/runtime/v2-provider-event-liveness.test.mjs

      - name: Run Antigravity global adapter and provider symmetry tests
        run: node --test tests/runtime/v2-antigravity-global-adapter.test.mjs tests/runtime/v2-provider-symmetry.test.mjs

      - name: Run v2 domain, reference state and continuation tests
        run: node --test tests/runtime/v2-domain-foundation.test.mjs tests/runtime/v2-reference-state.test.mjs tests/runtime/v2-continuation-boundary.test.mjs

      - name: Run V2-10 portability closure gates
        run: |
          npm run test:firewall
          npm run test:installers
          npm run build:runtimes
          npm run check:runtimes
          npm run check:runtime-core
          npm run check:contamination

  v1-regression:
    name: V1 Compatibility Guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 legacy baseline
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Verify generated artifacts remain isolated
        run: |
          npm run build:schemas
          npm run build:runtimes
          npm run check:schemas
          npm run check:runtimes
          npm run check:runtime-core
          git diff --check

      - name: Verify v2 launcher fails structurally before SQLite on Node 20
        run: >-
          node -e "const {spawnSync}=require('node:child_process');
          const r=spawnSync(process.execPath,['v2/global/orchestra.mjs','home'],{encoding:'utf8'});
          let body=null; try { body=JSON.parse(r.stderr); } catch {}
          if (r.status!==2 || r.stdout!=='' || body?.code!=='ORCHESTRA_V2_RUNTIME_UNSUPPORTED' || body?.minimumNodeMajor!==24) {
            console.error(JSON.stringify({status:r.status,stdout:r.stdout,stderr:r.stderr})); process.exit(1);
          }"

      - name: Run full v1 regression
        run: npm test

      - name: Verify contamination boundary
        run: npm run check:contamination
