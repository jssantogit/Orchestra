name: V2 Persistence

on:
  pull_request:
    branches:
      - main
      - feat/v2-domain-contracts

jobs:
  persistence:
    name: V2 Persistence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Run v2 persistence tests
        run: node --test tests/v2-persistence/*.test.mjs

  v1-regression:
    name: V1 Compatibility Guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 legacy baseline
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Verify generated artifacts remain isolated
        run: |
          npm run build:schemas
          npm run build:runtimes
          npm run check:schemas
          npm run check:runtimes
          npm run check:runtime-core
          git diff --check

      - name: Run full v1 regression
        run: npm test
