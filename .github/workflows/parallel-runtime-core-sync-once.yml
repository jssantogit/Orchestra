name: Parallel Runtime Core Sync One Shot

on:
  push:
    branches:
      - feat/parallel-implementation-2

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/parallel-implementation-2
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync canonical runtime core outputs
        run: |
          npm run sync:runtime-core
          npm run build:runtimes
          npm run check:runtime-core
          npm run check:runtimes

      - name: Commit deterministic outputs and remove one-shot
        run: |
          git config user.name "orchestra-ci"
          git config user.email "orchestra-ci@users.noreply.github.com"
          git rm .github/workflows/parallel-runtime-core-sync-once.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 1
          fi
          git commit -m "build: sync parallel scope runtime mirrors"
          git push origin HEAD:feat/parallel-implementation-2
